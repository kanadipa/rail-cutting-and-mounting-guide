services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rail
      POSTGRES_PASSWORD: rail
      POSTGRES_DB: rail_guide
    ports:
      - "${POSTGRES_PORT:-54329}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rail -d rail_guide"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
